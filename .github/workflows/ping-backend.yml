name: Keep Render Backend Alive

on:
    schedule:
        - cron: '*/5 * * * *'  
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Render Backend
              run: curl -s -A "Mozilla/5.0" -L https://doodle-predict.onrender.com/api/healthcheck
